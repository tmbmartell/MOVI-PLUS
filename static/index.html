<template id="landing-public-template">

    <main>
      <section class="ng-hero" id="inicio">

            <h1>Você dirige o carro.<br><em>Agora, dirija o seu dinheiro.</em></h1>
            <p class="ng-hero-description">No fim do dia, você sabe quantas corridas fez. Mas sabe quanto realmente ficou no seu bolso? Conheça o clube que ajuda a organizar seus ganhos, entender seus gastos e planejar suas próximas conquistas.</p>
            <div class="ng-hero-buttons">
              <button type="button" class="ng-btn ng-btn-gold ng-btn-large" data-ng-auth="login" data-ng-role="driver">Entrar no meu Clube <span aria-hidden="true">↗</span></button>
              <a class="ng-btn ng-btn-outline ng-btn-large" href="#como-funciona">Descubra como funciona <span aria-hidden="true">↓</span></a>
            </div>
            <div class="ng-hero-foot"><div class="ng-avatar-stack" aria-hidden="true"><span>M</span><span>99</span><span>+</span></div><span>Para motoristas de aplicativo, delivery e quem trabalha sobre rodas.</span></div>
          </div>
          <div class="ng-hero-visual">
            <div class="ng-road-dashes" aria-hidden="true"></div>
            <div class="ng-float ng-float-top">
              <span class="ng-float-icon">↘</span><span><small>Seu dinheiro mais claro</small><strong>Saiba para onde ele vai</strong></span>
            </div>
            <div class="ng-phone" aria-label="Simulação ilustrativa do agente financeiro no celular">
              <div class="ng-phone-island"></div>
              <div class="ng-phone-screen">
                <div class="ng-phone-top"><span class="ng-phone-time">9:41</span><span aria-hidden="true">◖◖  ▰</span></div>
                <div class="ng-phone-brand"><span class="ng-phone-logo">↗</span><span><strong>Meu Clube</strong><small>Seu copiloto financeiro</small></span><span class="ng-phone-menu">•••</span></div>
                <div class="ng-phone-balance"><small>Exemplo de ganhos registrados</small><strong>R$ 3.420<span>,00</span></strong><span>↑ Registros feitos por você</span></div>
                <div class="ng-phone-caption">Seu dinheiro, sem complicação.</div>
                <div class="ng-phone-chart" aria-hidden="true"><span style="height:39%"></span><span style="height:57%"></span><span style="height:45%"></span><span style="height:82%"></span><span style="height:63%"></span><span style="height:98%"></span><span style="height:75%"></span></div>

                <div class="ng-phone-chat"><span class="ng-phone-chat-icon">✦</span><span><strong>Seu agente financeiro</strong><small>“Como posso ajudar hoje?”</small></span><span aria-hidden="true">→</span></div>
                <div class="ng-phone-nav" aria-hidden="true"><span>⌂<small>Início</small></span><span>▥<small>Registros</small></span><span>✦<small>Agente</small></span><span>◯<small>Conta</small></span></div>

      <section class="ng-section ng-section-problem" id="beneficios">
        <div class="ng-container">
          <div class="ng-center-intro"><span class="ng-overline">CHEGA DE TRABALHAR NO ESCURO</span><h2>Seu carro roda todos os dias.<br><span>Seu dinheiro precisa acompanhar.</span></h2><p>Combustível, mercado, farmácia, manutenção, parcelas... Quando tudo se mistura, fica difícil saber onde economizar. O Clube te ajuda a enxergar o todo.</p></div>
          <div class="ng-feature-grid">
            <article class="ng-feature"><span class="ng-feature-no">01 /</span><span class="ng-feature-icon" aria-hidden="true">▤</span><h3>Saiba quanto ganha</h3><p>Organize o dinheiro das corridas e acompanhe os valores que você registrou, sem depender de planilhas complicadas.</p><span class="ng-feature-bottom">Clareza todo dia <b>↗</b></span></article>
            <article class="ng-feature"><span class="ng-feature-no">02 /</span><span class="ng-feature-icon" aria-hidden="true">◎</span><h3>Descubra onde gasta</h3><p>Separe combustível, supermercado, farmácia e outros gastos para entender o que pesa mais no seu orçamento.</p><span class="ng-feature-bottom">Tudo no seu lugar <b>↗</b></span></article>
            <article class="ng-feature"><span class="ng-feature-no">03 /</span><span class="ng-feature-icon" aria-hidden="true">✦</span><h3>Converse com seu agente</h3><p>Digite uma despesa, envie um áudio ou uma foto. O agente sugere o lançamento e você confere antes de salvar.</p><span class="ng-feature-bottom">Tecnologia que ajuda <b>↗</b></span></article>
            <article class="ng-feature"><span class="ng-feature-no">04 /</span><span class="ng-feature-icon" aria-hidden="true">↗</span><h3>Planeje o próximo passo</h3><p>Veja padrões, acompanhe metas e receba orientações para tomar decisões melhores com o seu dinheiro.</p><span class="ng-feature-bottom">Seu futuro começa agora <b>↗</b></span></article>
          </div>
        </div>
      </section>

        <div class="ng-container ng-how-grid">
          <div class="ng-how-copy">
            <span class="ng-overline">É SIMPLES DE VERDADE</span>
            <h2>Menos contas na cabeça.<br><em>Mais direção na vida.</em></h2>
            <p>Você não precisa entender de finanças nem aprender um sistema complicado. Só começar a registrar o seu dia, no seu ritmo.</p>
            <ol class="ng-steps">
              <li><span>01</span><div><strong>Entre no seu Clube</strong><p>Use sua conta individual ou faça seu cadastro com um convite.</p></div></li>
              <li><span>02</span><div><strong>Conte o que entrou e saiu</strong><p>Escreva, mande áudio ou uma foto diretamente na plataforma.</p></div></li>
              <li><span>03</span><div><strong>Confira e entenda</strong><p>Confirme cada lançamento e acompanhe suas categorias e possibilidades de economia.</p></div></li>
            </ol>
            <button class="ng-btn ng-btn-dark ng-btn-large" type="button" data-ng-auth="login" data-ng-role="driver">Começar a me organizar <span aria-hidden="true">↗</span></button>
          </div>
          <div class="ng-how-panel">
            <span class="ng-how-corner">SEU DINHEIRO EM PERSPECTIVA</span>
            <div class="ng-how-circle"><div class="ng-how-circle-inner"><span>Mais clareza</span><strong>no fim<br>do mês.</strong></div></div>
            <div class="ng-how-strip"><div><small>O que entrou</small><b>Receitas registradas</b></div><span aria-hidden="true">＋</span><div><small>O que saiu</small><b>Despesas por categoria</b></div><span aria-hidden="true">＝</span><div><small>O próximo passo</small><b>Planejamento</b></div></div>
          </div>
        </div>

            <button class="ng-demo-choice ng-is-active" type="button" data-ng-example="fuel" aria-pressed="true"><span>⛽</span> Abastecimento</button>
            <button class="ng-demo-choice" type="button" data-ng-example="market" aria-pressed="false"><span>🛒</span> Supermercado</button>
            <button class="ng-demo-choice" type="button" data-ng-example="income" aria-pressed="false"><span>↗</span> Ganhos do dia</button>
          </div><p class="ng-demo-note">O agente não confirma pagamentos bancários nem faz transações. Você decide o que entra no seu financeiro.</p></div>
          <div class="ng-demo-chat" aria-live="polite" aria-atomic="true">
            <div class="ng-chat-header"><span class="ng-chat-avatar">✦</span><span><strong>Agente do Motorista</strong><small><span class="ng-online"></span> Prévia interativa</small></span><span class="ng-chat-three" aria-hidden="true">•••</span></div>
            <div class="ng-chat-body">
              <div class="ng-chat-day">Exemplo demonstrativo</div>
              <div class="ng-chat-bubble ng-chat-user" id="ngExampleInput">“Gastei R$ 85 de combustível hoje.”</div>
              <div class="ng-chat-bubble ng-chat-agent"><span class="ng-agent-label">✦ AGENTE FINANCEIRO</span><p id="ngExampleReply">Identifiquei uma despesa com combustível. Esse tipo de gasto pode ser parte do seu trabalho. Vamos acompanhar quanto ele representa no mês?</p><div class="ng-chat-receipt"><small>LANÇAMENTO SUGERIDO</small><div><strong id="ngExampleCategory">Combustível</strong><strong id="ngExampleAmount">R$ 85,00</strong></div><span>Revisão necessária antes de salvar</span></div></div>
              <div class="ng-chat-inputmock"><span>Escreva ou envie um áudio...</span><strong aria-hidden="true">＋</strong></div>
            </div>
          </div>
        </div>

      <section class="ng-section ng-trust"><div class="ng-container ng-trust-grid"><span class="ng-trust-emblem" aria-hidden="true">◈</span><div><span class="ng-overline">SEUS DADOS, SUAS ESCOLHAS</span><h2>Você está no controle.</h2><p>O Clube pede sua autorização para usar seus dados financeiros. As sugestões do agente precisam ser confirmadas, e seus registros não são movimentações bancárias. O atendimento automático pelo WhatsApp ainda não está ativado.</p></div><div class="ng-trust-points"><span>✓ Conta individual</span><span>✓ Autorizações independentes</span><span>✓ Nenhum Pix automático</span></div></div></section>

      <section class="ng-final"><div class="ng-container ng-final-inner"><div><span class="ng-overline">O PRÓXIMO PASSO É SEU</span><h2>Você já está na direção.<br><em>Agora cuide do destino.</em></h2><p>Comece a entender seus ganhos, organizar seus gastos e fazer planos que cabem na sua realidade.</p></div><div class="ng-final-actions"><button type="button" class="ng-btn ng-btn-gold ng-btn-large" data-ng-auth="login" data-ng-role="driver">Entrar no meu Clube <span aria-hidden="true">↗</span></button><button type="button" class="ng-final-link" data-ng-auth="enroll" data-ng-role="driver">Recebi um convite de acesso →</button></div></div></section>
